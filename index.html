<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./timora-logo.jpg" />
    <link rel="apple-touch-icon" href="./timora-logo.jpg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff2a85" />
    <meta name="description" content="Timora - Focus. Time. Anywhere. Digital Worldwide Clock and Pomodoro Focus Timer with YouTube study player." />
    <title>Timora - Worldwide Clock & Pomodoro</title>
    <!-- Google Fonts: Outfit for sleek modern UI, JetBrains Mono for crisp digital time readout -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Timora PWA Service Worker Registered', reg))
            .catch(err => console.log('Timora SW Registration failed: ', err));
        });
      }
    </script>
  </body>
</html>
