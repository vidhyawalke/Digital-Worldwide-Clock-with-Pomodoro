<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Timora_Logo_landing.png" />
    <link rel="apple-touch-icon" href="/Timora_Logo_landing.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E05638" />
    <meta name="description" content="Timora - Focus. Time. Anywhere. A world clock & pomodoro app that keeps you focused, wherever you are." />
    <title>Timora - Worldwide Clock & Pomodoro</title>
    <!-- Google Fonts: Plus Jakarta Sans, Playfair Display, Poppins, and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Timora SW Registered', reg))
            .catch(err => console.log('Timora SW note:', err));
        });
      }
    </script>
  </body>
